<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Route Builder</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  </head>
  <body>
    <div class="header">
      Route Builder
      <div class="menu-container">
        <button class="menu-btn" onclick="toggleMenu()">
          Routes Library 🗺
        </button>
        <div id="menu-dropdown" class="menu-dropdown">
          <button onclick="openSaveModal()">Save Route</button>
          <button onclick="openViewModal()">View Saved Routes</button>
        </div>
      </div>
    </div>

    <div class="container">
      <div class="sidebar">
        <textarea id="input" placeholder="Paste log data here..."></textarea>
        <button onclick="buildRoute()">Build Route</button>
        <div id="route-list" class="route-list"></div>
      </div>
      <div id="map"></div>
    </div>

    <div id="save-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <span>Route Name</span>
          <button class="close-btn" onclick="closeModal('save-modal')">
            ✖
          </button>
        </div>
        <input type="text" id="route-name-input" placeholder="Enter name..." />
        <button class="btn-save-confirm" onclick="confirmSaveRoute()">
          Save
        </button>
      </div>
    </div>

    <div id="view-modal" class="modal">
      <div class="modal-content wide">
        <div class="modal-header">
          <span>Saved Routes</span>
          <button class="close-btn" onclick="closeModal('view-modal')">
            ✖
          </button>
        </div>
        <div id="saved-routes-list" class="saved-routes-list"></div>
      </div>
    </div>

    <div id="alert-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <span id="alert-title">Notification</span>
          <button class="close-btn" onclick="closeModal('alert-modal')">
            ✖
          </button>
        </div>
        <p
          id="alert-message"
          style="color: #2c3e50; font-size: 14px; margin-bottom: 20px"
        ></p>
        <button onclick="closeModal('alert-modal')">OK</button>
      </div>
    </div>

    <div id="confirm-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <span>Confirm Action</span>
          <button class="close-btn" onclick="closeModal('confirm-modal')">
            ✖
          </button>
        </div>
        <p style="color: #2c3e50; font-size: 14px; margin-bottom: 20px">
          Are you sure you want to delete this route?
        </p>
        <div style="display: flex; gap: 10px">
          <button class="btn-del" id="confirm-delete-btn">Delete</button>
          <button
            style="background: #95a5a6"
            onclick="closeModal('confirm-modal')"
          >
            Cancel
          </button>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
